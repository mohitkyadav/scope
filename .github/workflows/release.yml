# Pushing a tag like v1.2.0 builds Scope, signs it with the "Scope Release" certificate, publishes
# a GitHub release with the zip, and updates the cask in the homebrew-tap repo.
#
# Running it by hand (Actions → Release → Run workflow) only builds and signs, and keeps the zip
# as a workflow artifact, so the setup can be checked without publishing anything.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Set the RELEASE_RUNNER repository variable to "xcode-27" if Scope needs a newer Xcode than macos-26 has.
    runs-on: ${{ vars.RELEASE_RUNNER || 'macos-26' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The build number counts commits.
          fetch-depth: 0

      - name: Pick the version
        id: version
        run: |
          echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Add the SIGNING_CERTIFICATE_P12 and SIGNING_CERTIFICATE_PASSWORD secrets"
            exit 1
          fi
          password=$(uuidgen)
          security create-keychain -p "$password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$password" "$SIGNING_KEYCHAIN"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$SIGNING_KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$SIGNING_KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build and sign
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild -version
          zip=$(scripts/build-release.sh "$VERSION")
          codesign -dv build/release/DerivedData/Build/Products/Release/Scope.app
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat "$zip.sha256")" >> "$GITHUB_OUTPUT"

      - name: Keep the zip
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Scope-${{ steps.version.outputs.version }}
          path: ${{ steps.build.outputs.zip }}

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Scope $VERSION" --generate-notes

      - name: Update the Homebrew tap
        if: github.ref_type == 'tag'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::Add the TAP_TOKEN secret"
            exit 1
          fi
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$OWNER/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Casks"
          scripts/cask.sh "$VERSION" "$SHA256" > "$tap/Casks/scope.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/scope.rb
          git commit -m "Update Scope to $VERSION"
          git push origin HEAD:main

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "${SIGNING_KEYCHAIN:-}" || true
